<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo Azul-Marinho com Cantos Arredondados e Fundo Transparente Externo -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#1F3A6E" />

  <!-- Gráfico de 4 Barras de Desempenho -->
  <!-- 1. Vermelho Suave (Abaixo do Básico) -->
  <rect x="141" y="290" width="44" height="100" rx="12" fill="#E57373" />

  <!-- 2. Laranja (Básico) -->
  <rect x="203" y="235" width="44" height="155" rx="12" fill="#FFB74D" />

  <!-- 3. Amarelo (Adequado) -->
  <rect x="265" y="180" width="44" height="210" rx="12" fill="#FDD835" />

  <!-- 4. Verde (Avançado) -->
  <rect x="327" y="125" width="44" height="265" rx="12" fill="#4CAF50" />

  <!-- Marca de Verificação (Check) sobre a Barra Verde -->
  <path d="M 337 98 L 346 107 L 363 85" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
